<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Guide Studio Skill · 移动端效果预览</title>
<style>
:root{color-scheme:light;--paper:#f6f4ed;--ink:#294537;--muted:#7c8275;--line:#dadfd1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"PingFang SC",sans-serif}.bar{max-width:1060px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 28px}.identity{display:flex;align-items:center;gap:11px}.mark{width:29px;height:29px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:17px "Songti SC",serif}.identity strong{display:block;font-size:12px;letter-spacing:.6px;font-weight:550}.identity small{display:block;font-size:10px;color:var(--muted)}nav{display:flex;gap:18px;align-items:center}a{color:var(--ink);text-decoration:none;font-size:11px}a:hover{text-decoration:underline;text-underline-offset:4px}a:focus-visible{outline:2px solid #b26142;outline-offset:4px}.stage{display:flex;justify-content:center;padding:12px 20px 32px;background:radial-gradient(ellipse at 50% 40%,#e7ecdf 0,transparent 55%)}.phone{width:414px;max-width:100%;padding:12px;background:#263b32;border-radius:42px;box-shadow:0 20px 55px #263b3226,0 3px 10px #263b3220}.screen{position:relative;height:844px;overflow:hidden;border-radius:31px;background:var(--paper)}iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}.below{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:0 20px 24px}.below a{font-size:10px;color:var(--muted)}@media(max-width:500px){.bar{padding:15px 15px 10px;align-items:center}.identity{gap:8px}.identity strong{font-size:10px;letter-spacing:0}.identity small{font-size:9px}nav{gap:10px}nav a{font-size:10px}.stage{padding:7px 8px 16px}.phone{width:100%;padding:5px;border-radius:29px;box-shadow:0 8px 24px #263b321c}.screen{height:calc(100dvh - 135px);min-height:550px;border-radius:24px}.below{padding-bottom:15px;gap:15px}}
.preview-loading{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--paper);text-align:center;padding:28px}.preview-loading[hidden]{display:none}.loading-spinner{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:loading-turn .9s linear infinite}.preview-loading strong{font-weight:500;font-size:14px}.preview-loading p{margin:0;font-size:11px;color:var(--muted)}.loading-retry{border:1px solid var(--line);border-radius:4px;padding:9px 18px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.loading-retry[hidden]{display:none}@keyframes loading-turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loading-spinner{animation:none}}
.install{width:414px;max-width:calc(100% - 32px);margin:0 auto 2px}.install-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.install strong{font-size:12px;font-weight:550}.install p{margin:2px 0 0;color:var(--muted);font-size:10px}.copy-install{min-height:44px;flex-shrink:0;padding:8px 14px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--paper);font:inherit;font-size:11px;cursor:pointer}.copy-install:focus-visible,.install summary:focus-visible,.install textarea:focus-visible{outline:2px solid #b26142;outline-offset:3px}.install details{margin-top:4px}.install summary{width:fit-content;color:var(--muted);font-size:10px;cursor:pointer}.install textarea{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fffdf7;color:var(--ink);font:inherit;font-size:12px;line-height:1.7;resize:vertical;overflow-wrap:anywhere}
@media(max-width:500px){.screen{height:calc(100dvh - 215px)}}
</style></head>
<body><header class="bar"><div class="identity"><span class="mark">山</span><div><strong>Travel Guide Studio Skill</strong><small>旅行攻略生成技能</small></div></div><nav aria-label="项目入口"><a href="https://github.com/chenchen428/travel-guide-studio-skill">GitHub</a><a href="downloads/travel-guide-studio.zip" download>下载技能</a></nav></header>
<section class="install" aria-labelledby="install-title">
<div class="install-row"><div><strong id="install-title">让 Agent 安装技能</strong><p id="install-feedback" role="status">复制提示词，粘贴给你的 Agent</p></div><button class="copy-install" id="copy-install" type="button">复制提示词</button></div>
<details id="install-details"><summary>查看安装提示词</summary><textarea id="install-prompt" aria-label="Agent 安装技能提示词" rows="3" readonly>请按此指引安装技能：https://chenchen428.github.io/travel-guide-studio-skill/install.md</textarea></details>
</section>
<main class="stage"><div class="phone"><div class="screen" aria-busy="true"><div class="preview-loading" id="preview-loading" role="status"><span class="loading-spinner" aria-hidden="true"></span><strong>正在打开旅行手册</strong><p id="loading-message">行程与路线地图即将就绪…</p><button class="loading-retry" id="loading-retry" hidden>重新加载</button></div><iframe id="guide-preview" src="hangzhou-guide.html?v=8cde54118fab#trip" title="手机旅行攻略效果预览" allow="geolocation; clipboard-write; web-share"></iframe></div></div></main><footer class="below"><a href="hangzhou-guide.html#trip" target="_blank" rel="noopener noreferrer">独立打开攻略 ↗</a><a href="https://github.com/chenchen428/travel-guide-studio-skill/blob/main/README.md">English</a><a href="https://github.com/chenchen428/travel-guide-studio-skill/blob/main/README.zh-CN.md">中文</a></footer><script>
const preview=document.getElementById('guide-preview'),loading=document.getElementById('preview-loading'),retry=document.getElementById('loading-retry');
let slowLoad;
function startLoading(){loading.hidden=false;preview.parentElement.setAttribute('aria-busy','true');retry.hidden=true;document.getElementById('loading-message').textContent='行程与路线地图即将就绪…';clearTimeout(slowLoad);slowLoad=setTimeout(()=>{document.getElementById('loading-message').textContent='加载时间较长，请稍候或重试。';retry.hidden=false;},12000);}
function previewReady(){clearTimeout(slowLoad);loading.hidden=true;preview.parentElement.setAttribute('aria-busy','false');}
window.addEventListener('message',e=>{if(e.source===preview.contentWindow&&e.origin===location.origin&&e.data?.type==='travel-guide-ready')previewReady();});
preview.addEventListener('load',()=>{if(preview.contentDocument?.body?.dataset.guideReady==='true')previewReady();});
retry.onclick=()=>{startLoading();preview.src=preview.getAttribute('src');};
startLoading();
const installPrompt=document.getElementById('install-prompt'),copyInstall=document.getElementById('copy-install'),installFeedback=document.getElementById('install-feedback');
copyInstall.onclick=async()=>{
  try{
    await navigator.clipboard.writeText(installPrompt.value);
    copyInstall.textContent='已复制';
    installFeedback.textContent='已复制，粘贴给 Agent 即可安装';
  }catch{
    document.getElementById('install-details').open=true;
    installPrompt.focus();installPrompt.select();
    installFeedback.textContent='自动复制未成功，请复制下方已选中的提示词';
  }
};
</script></body></html>
