<script>
'use strict';
const data=JSON.parse(document.getElementById('trip-data').textContent);
const isHistory=data.status==='historical-example';
const dayDate=(d,i)=>d.date?d.date.slice(5).replace('-','.'):'第 '+(i+1)+' 天';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const sourceLevels={官方:'官方机构、运营方或主管部门的一手信息；仍需确认适用日期。',官媒:'媒体报道或记者实地走访；发布后仍可能变化。',网友:'个人游记、评论与使用经验，存在个体差异。',推断:'基于已知资料的判断或测算，非直接公布事实。',未查到:'未找到足够可靠的来源，出发前需要确认。'};
function fmt(s){return esc(String(s??'').replace(/<[^>]*>/g,''))
 .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
 .replace(/`([^`]+)`/g,(_,v)=>`<button class="inline-copy" data-copy="${v}" title="点击复制">${v} ⧉</button>`)
 .replace(/\{\{t:([^}]+)\}\}/g,(_,v)=>`<a href="tel:${v.replace(/[^0-9+]/g,'')}">${v}</a>`)
 .replace(/\{\{m:([^}]+)\}\}/g,(_,v)=>`<a href="${mapUrl(v)}" target="_blank" rel="noopener noreferrer">地图 ${v} ↗</a>`)
 .replace(/【((?:官方|官媒|网友|推断|未查到)[^】]{0,6})】/g,(_,v)=>`<button class="source-btn inline-source" data-src="${Object.keys(sourceLevels).find(k=>v.startsWith(k))}">${v} ⓘ</button>`)
 .replace(/\n/g,'<br>');}
const clean=s=>String(s??'').replace(/<[^>]*>/g,'').replace(/\*\*|`|🔑|🔴|⚠️|✅|⛔|⭐/g,'').trim();
const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?esc(u.href):'';}catch{return '';}};
const money=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n);
const baiduUrl=q=>'https://api.map.baidu.com/geocoder?address='+encodeURIComponent(data.destination+' '+q)+'&output=html&src=webapp';
function mapBtn(q){return `<a class="map-link" href="${mapUrl(q)}" target="_blank" rel="noopener noreferrer">高德 ↗</a> <a class="map-link" href="${baiduUrl(q)}" target="_blank" rel="noopener noreferrer">百度 ↗</a> <button class="inline-copy" data-copy="${esc(q)}">复制名称</button>`;}
const mapUrl=q=>'https://uri.amap.com/search?keyword='+encodeURIComponent(data.destination+' '+q)+'&city='+encodeURIComponent(data.destination);
const tabs=[['trip','每日行程','calendar'],['prep','出发准备','check'],['transport','交通指南','route'],['food','寻味杭州','food'],['budget','旅行预算','wallet'],['practical','随身锦囊','info']];
const typeNames={transit:'ON THE WAY · 交通',food:'TASTE · 餐饮',indoor:'INDOORS · 室内',spot:'EXPLORE · 游览',night:'AFTER DARK · 夜游',rest:'SLOW DOWN · 休整',hike:'IN NATURE · 徒步'};
let current='trip',dayIndex=0,view='timeline',tier=data.budget.defaultTier,people=data.travelers,addons=new Set(),toastTimer;
const storageKey='travel-guide:'+data.destination+':'+(data.days[0].date||data.title);let checks={};
try{checks=JSON.parse(localStorage.getItem(storageKey)||'{}');}catch{checks={};}
async function copyText(value,message){try{await navigator.clipboard.writeText(value);toast(message||'已复制：'+value);}catch{toast('复制未完成，请选中内容手动复制。');}}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000);}
function saveChecks(){try{localStorage.setItem(storageKey,JSON.stringify(checks));}catch{toast('本次勾选已生效；浏览器未允许本地保存。');}}
function section(title,sub,number,actions=''){return `<div class="section-top"><div><div class="eyebrow muted" style="margin-bottom:9px">YOUR TRAVEL COMPANION</div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${actions||`<span class="issue">${number}</span>`}</div>`;}
function sourceButton(){return '<button class="source-btn" data-source>信息来源与核实状态 ↗</button>';}
function citations(list=[]){return list.length?'<div style="font-size:10px;margin-top:9px">'+list.map(c=>`<a href="${safeUrl(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.label)} · ${esc(c.level)} · ${esc(c.asOf)}${c.verified?'':' · 未独立核实'} ↗</a>`).join('<br>')+'</div>':'';}
function renderNav(){ $('#tabs').innerHTML=tabs.map(([id,name,ic])=>`<button id="tab-${id}" class="nav-tab" role="tab" aria-selected="${id===current}" aria-controls="panel" tabindex="${id===current?0:-1}" data-tab="${id}">${icon(ic)}<span>${esc(name.replace('杭州',data.destination))}</span></button>`).join('');$('#panel').setAttribute('aria-labelledby','tab-'+current);}
function route(d,wide=false){const points=d.stops.filter(s=>s.mapQuery);return `<div class="route">${points.map((s,i)=>`<div class="route-node" data-number="${i+1}"><div><a href="${mapUrl(s.mapQuery)}" target="_blank" rel="noopener noreferrer">${esc(s.mapQuery)} ↗</a>${wide?`<small>${esc(s.time)} · ${esc(s.transport)}</small>`:''}</div></div>`).join('')||'<p class="muted">此日未提供可定位地点。</p>'}</div><div class="aside-note">路线顺序示意，非地理比例地图。点地点可打开高德搜索；步行距离与路况需在地图内确认。</div>`;}
function branchBlock(d,printMode){return d.extra?.branch?`<div class="alternative" style="margin:15px 0 20px"><h3>${esc(clean(d.extra.branch.title))}</h3>${d.extra.branch.opts.map(b=>`<details ${printMode?'open':''}><summary>${esc(clean(b.t))}</summary><p>${fmt(b.cond)}</p><p>${fmt(b.d)}</p></details>`).join('')}</div>`:'';}
function dayBody(d,printMode=false){return `<div class="day-heading"><div><div class="eyebrow muted" style="margin-bottom:8px">DAY ${String(dayIndex+1).padStart(2,'0')} / ${esc(dayDate(d,dayIndex))}</div><h3>${esc(d.title)}</h3><p>${esc(d.weather)} · ${esc(d.temperature)} · ${esc(d.kind)}</p>${d.extra?.flower?`<details><summary>花情与备选提醒</summary><div class="reference-chunk">${tree(d.extra.flower)}</div></details>`:""}</div><div><span class="pill warm">体力 ${esc(d.stamina)} / 5</span></div></div>${d.alerts.length?`<div class="soft-note"><strong>今日留意</strong> · ${fmt(d.alerts[0])}<div style="font-size:10px;margin-top:4px;opacity:.75">${isHistory?'原稿提醒，适用时间为原行程日期；未作为当前公告核实。':'出行前请再次核实预约、开放与交通安排。'}</div>${d.alerts.length>1?`<details><summary>其他提醒（${d.alerts.length-1}）</summary>${d.alerts.slice(1).map(a=>`<p style="margin:8px 0">${fmt(a)}</p>`).join('')}</details>`:''}</div>`:''}<div class="timeline">${d.stops.map((s,i)=>`<article class="stop" id="${esc(d.id)}-stop-${i}" tabindex="-1"><div class="stop-time">${esc(s.time.replace('—','–'))}</div><div class="stop-body"><div class="stop-type">${esc(typeNames[s.type]||'DISCOVER · 行程')}</div><h4>${esc(s.name)}</h4>${s.transport?`<p class="stop-transport">${icon('route')} ${esc(s.transport)}</p>`:''}${s.notes.length?`<p class="stop-blurb">${fmt(s.notes[0])}</p>`:''}${s.notes.length>1?`<details ${printMode?'open':''}><summary>展开实用细节 · ${s.notes.length-1} 条</summary><ul class="detail-notes">${s.notes.slice(1).map(n=>`<li>${fmt(n)}</li>`).join('')}</ul></details>`:''}${citations(s.sources)}${s.mapQuery?`<div class="stop-actions"><a class="map-link" href="${mapUrl(s.mapQuery)}" target="_blank" rel="noopener noreferrer">${icon('pin')} 高德导航 ↗</a><a class="map-link" href="${baiduUrl(s.mapQuery)}" target="_blank" rel="noopener noreferrer">百度 ↗</a><button class="copy-btn" data-copy="${esc(s.mapQuery)}">复制地点</button></div>`:''}</div></article>${/决策点/.test(s.name)?branchBlock(d,printMode):''}` ).join('')}</div>${!d.stops.some(s=>/决策点/.test(s.name))?branchBlock(d,printMode):''}<div class="alternative"><div class="eyebrow muted">A LITTLE FLEXIBILITY</div><h3>计划可以变，兴致不必减。</h3>${d.alternatives.map(a=>`<details ${printMode?'open':''}><summary>${esc(clean(a.q))}</summary><p>${fmt(a.a)}</p></details>`).join('')}<p style="font-size:11px;margin-top:13px">${fmt(d.rest)}</p></div>${Object.keys(d.extra||{}).length?`<details class="archive"><summary>当日补充：路线分支、里程与安排理由</summary><div class="reference-chunk">${tree(Object.fromEntries(Object.entries(d.extra).filter(([k])=>k!=='branch')))}</div></details>`:''}`;}
function renderTrip(){window.travelMap?.release();const d=data.days[dayIndex];$('#panel').innerHTML=section(data.sectionTitle||data.days.length+' 天，慢游'+data.destination+'。','每天都有留白，也都有值得期待的风景。','01',`<div class="view-toggle" aria-label="行程展示方式"><button data-view="timeline" aria-pressed="${view==='timeline'}">时间轴</button><button data-view="route" aria-pressed="${view==='route'}">地图</button><button data-amfull aria-label="全屏地图" ${data.map?'':'disabled title="待补充地图配置"'}>⤢</button></div>`)+`<div class="day-picker" aria-label="选择旅行日期">${data.days.map((d,i)=>`<button class="day-btn" data-day="${i}" aria-pressed="${dayIndex===i}" aria-label="第 ${i+1} 天 ${esc(d.label)}"><span class="day-index">DAY ${String(i+1).padStart(2,'0')}</span><div class="day-date">${esc(dayDate(d,i))}</div><span class="day-label">${esc(d.label)}</span><span class="day-weather">${esc(d.kind)} · ${esc(d.stamina)}/5</span></button>`).join('')}</div>`+(view==='route'?`<div id="am-inline" class="am-inline on" data-map-status="loading"><div class="am-in-hd" id="amInHd"></div><div class="am-in-stage"><div class="am-map" id="amInMap"></div><div class="am-in-load" id="amInLoad"><div class="am-spin"></div><div>正在加载地图…</div></div><div class="am-in-fb" id="amInFb"></div></div><div class="am-in-ft" id="amInFt"></div></div><div class="map-tools"><button class="plain-button" data-map-all ${data.map?'':'disabled'}>全程总览与备选路线</button></div>`:`<div class="journey-grid"><div>${dayBody(d)}</div><aside class="journey-aside"><div class="side-card"><div class="eyebrow muted">TODAY'S ROUTE</div><h3>今天，顺路而行。</h3>${route(d)}</div><div class="side-card"><div class="eyebrow muted">TRAVEL RHYTHM</div><h3>旅行也要有呼吸。</h3><div class="intensity-bars" aria-label="全程体力评分 ${data.days.map(d=>d.stamina).join('、')}">${data.days.map((d,i)=>`<button class="bar-day" data-chart-day="${i}" aria-label="查看第 ${i+1} 天行程"><div class="bar ${i===dayIndex?'active':''}" style="height:${d.stamina/5*100}%" title="第${i+1}天 ${d.stamina}/5"></div></button>`).join('')}</div><div class="bar-labels">${data.days.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:17px">${esc(clean(d.rest))}</p></div><div class="side-card"><div class="eyebrow muted">KEEP IN MIND</div><h3>先确认，再出发。</h3><p class="muted" style="font-size:11px">${isHistory?'天气、票价、预约和交通安排来自原稿历史资料。新行程需更新核实。':'出发前再确认天气、票价、预约与交通。未核实信息会在相关条目中标注。'}</p><div style="margin-top:15px">${sourceButton()}</div></div></aside></div>`)+`<div class="foot-note">信息截至 ${esc(data.asOf)} · ${isHistory?'原稿预测天气与安排仅作样例，所有细节均保留在折叠区。':'具体时刻、天气和价格以临近出发查询结果为准。'}</div>`;const picker=document.querySelector('.day-picker'),selected=picker?.querySelector('[aria-pressed=true]');if(picker&&selected)picker.scrollLeft=selected.offsetLeft-picker.offsetLeft-(picker.clientWidth-selected.offsetWidth)/2;
if(view==='route'){if(data.map)window.travelMap?.mount();else{document.getElementById('am-inline').innerHTML='<p class="soft-note">尚未提供地点坐标与地图配置。请补充真实坐标和路线数据；不会用路线示意代替地理地图。</p>';}}}
const keyLabels={n:'名称',d:'说明',t:'时间 / 联系方式',a:'地址 / 内容',r:'路线',q:'问题',s:'原稿来源等级',src:'来源',note:'注意',name:'名称',title:'标题',desc:'说明',go:'到达方式',noteId:'笔记 ID',map:'地图搜索名',p:'价格 / 分类',g:'分组',items:'条目',url:'链接',tips:'提示',taste:'风味',tip:'点单建议',train:'铁路',official:'原稿标注官方的交通参考',back:'返程',control:'交通管制',city:'市内交通',metro:'地铁',boat:'游船',hike:'徒步',channels:'预约渠道',phones:'紧急联系',hospitals:'医院',lost:'走散与失物',fuse:'停运与熔断',rumors:'信息辨别',rain:'雨天备选',flower:'花情资料',tide:'观潮资料',unknown:'待核实事项',about:'关于原稿',mjulong:'梅家坞与龙井交通',jxBest:'九溪推荐路线',jxNoDrive:'九溪通行提醒',spots:'热门地点交通',metroNote:'地铁提醒',noBook:'免预约地点',noBooking:'免预约说明',tonight:'出发前事项',weatherTable:'天气参考表',pitfalls:'出行提示',extra:'其他风味',cuyu:'西湖醋鱼说明',queueTrick:'错峰用餐',foot:'资料说明',t3:'三人总额',pp:'人均估算',sum3:'三人总额',per:'人均估算',range:'费用区间',econ:'经济档',comf:'舒适档',lux:'品质档',tag:'标记',opts:'可选路线',cond:'适用条件',k:'标识',cls:'原稿样式标签',star:'推荐',since:'历史背景',addr:'地址',sign:'招牌',price:'价格',queue:'排队情况',verdict:'选择建议',old:'老字号',new_:'本地家常与连锁',dishes:'杭帮菜',streets:'美食街区',xiaochi:'小吃',tea:'茶室',veg:'素食',plan:'用餐安排',deals:'历史优惠',avoid:'原稿用餐提示',rooms:'房型',hotels:'酒店',areas:'住宿片区',saves:'原稿省钱建议',addons:'原稿加项',tiers:'原稿三档预算',breakdown:'原稿预算明细',tune:'预算调节',principles:'行程设计原则',mileage:'里程',branch:'路线分支',logic:'安排理由'};
function tree(v,depth=0){if(v===null||v===undefined)return '';if(typeof v!=='object'){const raw=String(v);return /^https?:\/\//.test(raw)?`<a href="${safeUrl(raw)}" target="_blank" rel="noopener noreferrer">${esc(raw)}</a>`:fmt(raw);}if(Array.isArray(v))return '<ul>'+v.map(x=>`<li>${tree(x,depth+1)}</li>`).join('')+'</ul>';return Object.entries(v).filter(([k])=>!['cls'].includes(k)).map(([k,val])=>k==='noteId'&&typeof val==='string'?`<p>笔记 ID：${esc(val)} <button class="inline-copy" data-copy="${esc(val)}">复制笔记 ID</button></p>`:k==='map'&&typeof val==='string'?`<p><a href="${mapUrl(val)}" target="_blank" rel="noopener noreferrer">${icon('pin')} ${esc(val)} ↗</a> <a href="${baiduUrl(val)}" target="_blank" rel="noopener noreferrer">百度 ↗</a> <button class="inline-copy" data-copy="${esc(val)}">复制地点</button></p>`:typeof val==='object'&&val!==null?`<details><summary>${esc(keyLabels[k]||'补充信息')}</summary>${tree(val,depth+1)}</details>`:`<p><span class="label-key">${esc(keyLabels[k]||'补充信息')}</span>${tree(val,depth+1)}</p>`).join('');}
function hasContent(v){if(v==null)return false;if(typeof v==='object')return Object.values(v).some(hasContent);return typeof v==='string'?Boolean(v.trim()):true;}
function archive(title,obj){if(!hasContent(obj))return '';return `<details class="archive"><summary>${esc(title)}</summary><div class="reference-chunk">${tree(obj)}</div></details>`;}
function checklistRows(list){return list.map(c=>`<label class="check-row"><input type="checkbox" data-check="${esc(c.id)}" ${checks[c.id]?'checked':''}><span><strong>${fmt(c.title)}</strong><p>${fmt(c.detail)}</p></span></label>`).join('');}
function priorityBlock(){const list=data.priorityChecklist||[];if(!list.length)return '';return `<section class="content-card" style="margin-bottom:25px"><div class="eyebrow muted">FIRST THINGS FIRST</div><h3>优先确认的 ${list.length} 件事</h3><p class="muted" id="priority-status">已完成 ${list.filter(c=>checks[c.id]).length} / ${list.length}</p>${checklistRows(list)}<button class="plain-button" data-reset-priority style="margin-top:20px">重置优先事项勾选</button></section>`;}
function renderPrep(){let completed=data.checklist.filter(c=>checks[c.id]).length;$('#panel').innerHTML=section('准备妥当，才能走得轻松。','预约、车票与行李，按计划逐项确认。','02')+priorityBlock()+`<div class="content-grid"><section class="content-card"><div class="eyebrow muted">BEFORE YOU GO</div><h3>出发前的 ${data.checklist.length} 件小事</h3><p class="muted" id="check-status">已完成 ${completed} / ${data.checklist.length} · 仅保存到本浏览器</p><div class="check-progress"><div style="width:${completed/data.checklist.length*100}%"></div></div>${data.checklist.map(c=>`<label class="check-row"><input type="checkbox" data-check="${esc(c.id)}" ${checks[c.id]?'checked':''}><span><strong>${fmt(clean(c.title))}</strong><span class="pill warm" style="margin-left:8px">${esc(c.deadline)}</span><p>${fmt(c.detail)}</p></span></label>`).join('')}<button class="plain-button" data-reset-checks style="margin-top:20px">清空本行程的勾选</button></section><div><div class="content-card"><div class="eyebrow muted">THE WAY WE TRAVEL</div><h3>这份行程，为什么这样排。</h3>${(data.principles||[]).map(p=>`<details><summary>${esc(clean(p.t))}</summary><p>${fmt(p.d)}</p></details>`).join('')}</div><div class="soft-note">${isHistory?'此页是已结束行程的准备清单样例。原稿中的「今晚」「明早」均对应 '+esc(data.asOf)+'，不代表现在需要执行。':'请按实际出发日期确认预约和票务期限。日期未定时，清单先用于规划。'}</div>${archive(isHistory?'原稿其余准备资料与天气表':'补充准备资料',data.prepReference||{})}${archive('全部预约渠道与未核实信息',{channels:data.practical.channels,unknown:data.practical.unknown})}</div></div>`;}
function renderTransport(){const a=data.transport.arrive||{};$('#panel').innerHTML=section('少一点折腾，多一点风景。','先看进出城，再看每天怎么顺路走。','03')+`<div class="content-grid"><div class="content-card"><div class="eyebrow muted">ARRIVE & DEPART</div><h3>从${esc(data.origin)}到${esc(data.destination)}</h3>${(a.train||[]).map(row=>`<div class="list-row"><h4 style="margin:0 0 8px">${esc(row[0])}</h4><p>${row.slice(1).map(fmt).join(' · ')}</p></div>`).join('')}<div class="soft-note">${fmt(a.back||'请按车次预留进站时间。')}</div></div><div class="content-card"><div class="eyebrow muted">GETTING AROUND</div><h3>热门地点，怎样到达。</h3>${(a.official||[]).map(p=>`<div class="list-row"><strong>${esc(p.d)}</strong><p class="muted">${fmt(p.r)}</p></div>`).join('')}</div></div>${archive('展开完整交通参考：限行、接驳、游船、地铁、徒步',data.transport)}<div class="foot-note">${isHistory?'历史参考；':''}限行、末班车、票价与停航状态需临近出发再次查询。</div>`;}
function renderFood(){const dishes=data.food.dishes||[];$('#panel').innerHTML=section('寻味，也是一种认识'+data.destination+'。',data.foodIntro||'当地风味、街巷小吃，还有坐下来休息的时间。','04')+`<div class="content-grid">${dishes.map((d,i)=>`<article class="content-card"><div class="eyebrow muted">TASTE NOTE ${String(i+1).padStart(2,'0')}</div><h3>${esc(d.n)}</h3><p>${fmt(d.taste)}</p><details><summary>点单建议与背景</summary><p style="margin-bottom:12px">${fmt(d.tip)}</p><p class="muted">${fmt(d.src)}</p></details></article>`).join('')}</div>${archive('餐厅、街区、小吃、茶室、素食与每天用餐安排',Object.fromEntries(Object.entries(data.food).filter(([k])=>k!=='dishes')))}<div class="foot-note">餐厅营业状态、菜单价格与促销均需重新核实。${isHistory?'原稿观点与传说不作为已核实事实。':'个人经验与风味故事不等同于已核实经营信息。'}</div>`;}
function budgetValues(){const chosen=data.budget.tiers.find(t=>t.id===tier);const factor=b=>b==='person'?people:b==='night'?data.nights:b==='person-day'?people*data.days.length:1;const lines=chosen.items.map(c=>({...c,total:Math.round(c.amount*100)*factor(c.basis)/100}));const extra=data.budget.addons.filter(a=>addons.has(a.id)).map(c=>({...c,total:Math.round(c.amount*100)*factor(c.basis)/100}));return {chosen,lines,extra,total:Math.round([...lines,...extra].reduce((n,c)=>n+c.total,0)*100)/100};}
function renderBudget(){const b=budgetValues();const basis={person:`每人 × ${people} 人`,night:`每晚 × ${data.nights} 晚（整套）`,trip:'全程团队固定预留','person-day':`每人每天 × ${people} 人 × ${data.days.length} 天`};$('#panel').innerHTML=section('花在哪里，心里有数。','总额从分项计算，显示人均时才取整。','05')+`<div class="budget-layout"><div><div class="budget-controls"><div class="tier-tabs" aria-label="预算档位">${data.budget.tiers.map(t=>`<button data-tier="${esc(t.id)}" aria-pressed="${tier===t.id}">${esc(t.name)}</button>`).join('')}</div><label style="font-size:12px">人数 <input type="number" id="people" aria-label="出行人数" min="1" max="10" step="1" value="${people}"></label></div><div class="budget-summary"><h3>${esc(b.chosen.name)} · ${people} 人 · ${data.days.length} 天 ${data.nights} 晚</h3><div class="budget-total" id="budget-total"><small>¥ </small>${money(b.total)}</div><p id="budget-per">人均约 ¥ ${money(Math.round(b.total/people))} <span style="opacity:.65">/ 全程</span></p></div><p class="muted" style="font-size:12px">${esc(b.chosen.description)}</p><div class="soft-note">${esc(data.budget.note)}</div><section class="content-card"><h3>给旅行，多留一点选择。</h3><p class="muted">按标明的计价基数试算。已包含在所选档位中的项目会提示重复计费；不代表能够按此价格购买。</p>${data.budget.addons.map(a=>`<label class="check-row"><input type="checkbox" data-addon="${esc(a.id)}" ${addons.has(a.id)?'checked':''}><span><strong>${esc(a.name)} · ¥${money(a.amount)} / ${({person:'人',night:'晚（整套）',trip:'全程团队','person-day':'人 / 天'})[a.basis]}</strong><p>${fmt(a.note||'')}</p>${a.inBase?.includes(tier)?`<p class="duplicate-warning">已含在${esc(b.chosen.name)}基线中，勾选会重复计费。</p>`:''}${a.sourceLevel?`<button type="button" class="source-btn" data-src="${esc(a.sourceLevel)}">${esc(a.sourceLevel)} ⓘ</button>`:''}</span></label>`).join('')}${addons.has('xixi')&&addons.has('card66')?'<p class="duplicate-warning">原稿提示：西溪门票与 66 卡包含同一门票，请二选一，避免重复计费。</p>':''}</section></div><section class="content-card"><div class="eyebrow muted">BUDGET BREAKDOWN</div><h3>每一笔，都有去处。</h3>${[...b.lines,...b.extra].map(c=>`<div class="budget-line"><div><span>${esc(c.name)}</span><strong>¥ ${money(c.total)}</strong></div><div class="budget-track"><div style="width:${b.total?c.total/b.total*100:0}%"></div></div><small>¥${money(c.amount)} · ${esc(basis[c.basis])} · ${b.total?(c.total/b.total*100).toFixed(1):'0'}%</small>${citations(c.sources)}</div>`).join('')}<div class="budget-line" style="border:0"><div><strong>合计</strong><strong>¥ ${money(b.total)}</strong></div></div><button class="plain-button" data-reset-budget>恢复默认预算</button><p class="muted" style="font-size:10px;margin-top:18px">计算是费用估算；人数变化后需要重新确认房型、价格和预订条件。</p></section></div>${archive(isHistory?'对照原稿：预算、门票口径、酒店与住宿片区':'住宿与费用补充参考',data.archiveBudget||{})}`;}
function hoursBlock(){const h=data.practical.hours;if(!h)return '';return `<section class="content-card hours-card" style="margin-top:25px"><div class="eyebrow muted">OPENING HOURS</div><h3>营业时间速查</h3><p class="muted">原稿高德营业资料采集于 ${esc(h.asOf)}；最晚入场、节假日安排和临时停业以当日公告为准。</p><details><summary>展开 ${h.rows.length-1} 处营业时间与评分</summary><div class="hours-table"><table>${h.rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></details><details><summary>原稿国庆开放、闭馆与演出核对说明</summary><p class="reference-chunk">${fmt(h.notes)}</p></details></section>`;}
function renderPractical(){const p=data.practical;$('#panel').innerHTML=section('需要的时候，随手找得到。','紧急联系、天气备选、预约渠道与来源，都放在这里。','06')+`<div class="content-grid"><section class="content-card"><div class="eyebrow muted">STAY CONNECTED</div><h3>紧急联系</h3>${(p.phones||[]).map(g=>`<details ${g===p.phones[0]?'open':''}><summary>${esc(g.g)}</summary>${g.items.map(z=>`<div class="list-row"><strong>${esc(z.n)}</strong> <a href="tel:${esc(String(z.t).replace(/[^\d+-]/g,''))}">${esc(z.t)}</a><p class="muted">${fmt(z.d)}</p></div>`).join('')}</details>`).join('')}<p class="muted" style="font-size:10px;margin-top:15px">${isHistory?'历史资料号码；':''}当地专线需核实。遇紧急情况优先使用全国紧急热线。</p></section><section class="content-card"><div class="eyebrow muted">A PLAN THAT BENDS</div><h3>下雨、停航或体力不足</h3><p>每天的行程页都提供备选方案。优先缩短路线、转入室内，保留回酒店休整的余地。</p>${archive('停运与熔断参考',p.fuse||{})}${archive('医院与走散应对',{hospitals:p.hospitals,lost:p.lost})}${archive('雨天可选去处',p.rain||[])}<div style="margin-top:18px">${sourceButton()}</div></section></div>${hoursBlock()}${archive('补充参考：预约、目的地提示与待核实事项',Object.fromEntries(Object.entries(p).filter(([k])=>!['phones','hospitals','lost','rain','fuse','hours'].includes(k))))}${archive('社区经验与链接（个人观点，核实状态见资料说明）',data.community||{})}`;}

function preparePrint(){window.travelMap?.close();window.travelMap?.release();if(printing)return;printing=true;const old=dayIndex;$('#panel').innerHTML=section(data.destination+' · 全程行程','打印包含所有日期；完整参考资料请查看离线手册。','')+data.days.map((d,i)=>{dayIndex=i;return `<section class="print-day">${dayBody(d,true)}</section>`;}).join('');dayIndex=old;}

function tripStatus(now=new Date()){
 if(!data.days[0].date)return {text:'日期待定 · '+data.days.length+' 天旅行计划',day:0};
 const start=new Date(data.days[0].date+'T00:00:00'),end=new Date(data.days.at(-1).date+'T23:59:59');
 if(now<start){const left=start-now;return {text:'距出发还有 '+Math.floor(left/86400000)+' 天 '+String(Math.floor(left%86400000/3600000)).padStart(2,'0')+':'+String(Math.floor(left%3600000/60000)).padStart(2,'0')+':'+String(Math.floor(left%60000/1000)).padStart(2,'0'),day:0};}
 if(now<=end){const idx=Math.min(data.days.length-1,Math.floor((now-start)/86400000));return {text:'行程进行中 · 今天是第 '+(idx+1)+' 天 · '+data.days[idx].label,day:idx};}
 return {text:'行程已结束 · '+data.days[0].date+' 至 '+data.days.at(-1).date,day:0};
}
function updateStatus(){const status=tripStatus();$('#travel-status').textContent=status.text;}
const today=tripStatus();dayIndex=today.day;updateStatus();setInterval(updateStatus,1000);
